line-length = 120

[format]
preview = true

[lint]
# https://docs.astral.sh/ruff/rules/
select = [
    # https://docs.astral.sh/ruff/rules/#flake8-builtins-a
    # https://github.com/gforcada/flake8-builtins
    "A",
    # https://docs.astral.sh/ruff/rules/#flake8-async-async
    # https://github.com/python-trio/flake8-async
    "ASYNC",
    # https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
    # https://github.com/PyCQA/flake8-bugbear
    "B",
    # https://docs.astral.sh/ruff/rules/#flake8-blind-except-ble
    # https://github.com/elijahandrews/flake8-blind-except
    "BLE",
    # https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    # https://github.com/adamchainz/flake8-comprehensions
    "C4",
    # https://docs.astral.sh/ruff/rules/#error-e
    # https://github.com/PyCQA/pycodestyle
    "E",
    # https://docs.astral.sh/ruff/rules/#flake8-errmsg-em
    # https://github.com/henryiii/flake8-errmsg
    "EM",
    # https://docs.astral.sh/ruff/rules/#eradicate-era
    # https://github.com/PyCQA/eradicate
    "ERA",
    # https://docs.astral.sh/ruff/rules/#flake8-executable-exe
    # https://github.com/xuhdev/flake8-executable
    "EXE",
    # https://docs.astral.sh/ruff/rules/#pyflakes-f
    # https://github.com/PyCQA/pyflakes
    "F",
    # https://docs.astral.sh/ruff/rules/#refurb-furb
    # https://github.com/dosisod/refurb
    "FURB",
    # https://docs.astral.sh/ruff/rules/#flynt-fly
    # https://github.com/ikamensh/flynt
    "FLY",
    # https://docs.astral.sh/ruff/rules/#flake8-logging-format-g
    # https://github.com/globality-corp/flake8-logging-format
    "G",
    # https://docs.astral.sh/ruff/rules/#isort-i
    # https://pycqa.github.io/isort/
    "I",
    # https://docs.astral.sh/ruff/rules/#flake8-no-pep420-inp
    # https://github.com/adamchainz/flake8-no-pep420
    "INP",
    # https://docs.astral.sh/ruff/rules/#flake8-logging-log
    # https://github.com/adamchainz/flake8-logging
    "LOG",
    # https://docs.astral.sh/ruff/rules/#pep8-naming-n
    # https://github.com/PyCQA/pep8-naming
    "N",
    # https://docs.astral.sh/ruff/rules/#perflint-perf
    # https://github.com/tonybaloney/perflint
    "PERF",
    # https://docs.astral.sh/ruff/rules/#pygrep-hooks-pgh
    # https://github.com/pre-commit/pygrep-hooks
    "PGH",
    # https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
    # https://gitlab.com/RoPP/flake8-use-pathlib
    "PTH",
    # https://docs.astral.sh/ruff/rules/#flake8-raise-rse
    # https://github.com/jdufresne/flake8-raise
    "RSE",
    # https://docs.astral.sh/ruff/rules/#ruff-specific-rules-ruf
    # Project link is the astral/ruff website, so no external links.
    "RUF",
    # https://docs.astral.sh/ruff/rules/#flake8-bandit-s
    # https://github.com/tylerwince/flake8-bandit
    "S",
    # https://docs.astral.sh/ruff/rules/#flake8-simplify-sim
    # https://github.com/MartinThoma/flake8-simplify
    "SIM",
    # https://docs.astral.sh/ruff/rules/#flake8-print-t20
    # https://github.com/jbkahn/flake8-print
    "T20",
    # https://docs.astral.sh/ruff/rules/#flake8-tidy-imports-tid
    # https://github.com/adamchainz/flake8-tidy-imports
    "TID",
    # https://docs.astral.sh/ruff/rules/#tryceratops-try
    # https://github.com/guilatrova/tryceratops
    "TRY",
    # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    # https://github.com/asottile/pyupgrade
    "UP",
    # https://docs.astral.sh/ruff/rules/#warning-w
    # https://github.com/PyCQA/pycodestyle
    "W",
    # The engineering gate's limits on function size and shape (teaching-code-style U4, F7, K1).
    # https://docs.astral.sh/ruff/rules/#mccabe-c90
    "C90",
    # https://docs.astral.sh/ruff/rules/#pylint-pl
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004",
]
ignore = [
    # Absolute imports are not always better than relative imports.
    # https://docs.astral.sh/ruff/rules/relative-imports/
    "TID252",
    # Capitalised column names (rvs.TKS == orbit["TKS"]) look like constants to this rule, so it misfires.
    # https://docs.astral.sh/ruff/rules/yoda-conditions/
    "SIM300",
    # The teaching-code guide (rule F3) asks for a plain if/else block, not a conditional expression.
    # https://docs.astral.sh/ruff/rules/if-else-block-instead-of-if-exp/
    "SIM108",
]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-args = 6
max-positional-args = 4 # past this, callers pass by keyword (teaching-code-style F7)
max-branches = 12
max-returns = 6
max-statements = 40

[lint.per-file-ignores]
# Use of "assert" is normal and expected in the test files.
# https://docs.astral.sh/ruff/rules/assert/
"**/tests/**" = [
    "S101",
    # A test compares with the number it expects, written where the reader sees it.
    "PLR2004",
    # K, P and T0 are the papers' symbols, as in habtrain.
    "N806",
    # pytest hands a test its fixtures and parametrized values as arguments.
    "PLR0913",
    "PLR0917",
]
"habtrain/**" = [
    # habtrain talks to the member in the notebook's output, so print is its user interface.
    "T201",
    # K, P, T0, M and R are the papers' symbols, and P= and T0= are keyword names the notebooks use.
    "N803",
    "N806",
]
"scripts/**" = [
    # Command-line scripts run by make and CI, not a package to import.
    "INP001",
    # A script reports to the terminal by printing.
    "T201",
]
"notebooks/**" = [
    # Notebooks show their results by printing them.
    "T201",
    # The papers' symbols (K, P, T0, M, R), as in habtrain.
    "N803",
    "N806",
    # The setup cell imports numpy for the member's own cells, even where the notebook itself does not use it.
    "F401",
    # emcee hands a log probability its data as positional arguments, as emcee's own tutorial writes it.
    "PLR0913",
    "PLR0917",
    # The teaching-code guide (rule F1) prefers a plain loop that appends to a comprehension.
    "PERF401",
    # A teaching cell compares with the number its markdown just gave (3 sigma, an eccentricity of 0.1),
    # with a comment; a named constant would move that number out of the reader's sight.
    "PLR2004",
    # A cell that cannot run yet stops with one plain sentence for the member, written where it applies.
    "EM101",
    "TRY003",
]
