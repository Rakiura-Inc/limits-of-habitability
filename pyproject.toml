[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "habtrain"
version = "0.1.0"
description = """\
    Plumbing for the Limits of Habitability bootcamp notebooks: fetch the public catalogs, run emcee, plot, record \
    answers.\
    """
readme = "README.md"
license = "MIT"
authors = [ { name = "Rakiura" } ]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
# Lower bounds only, kept low on purpose: Colab already has most of these, and a notebook's setup
# cell should not replace them (that forces a restart). uv.lock pins the versions CI tests.
dependencies = [
    "astropy>=5.3",
    "corner>=2.2",
    "emcee>=3.1",
    "ipywidgets>=8",
    "lightkurve>=2.4",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2",
]

[project.optional-dependencies]
orbits = [ "orbitize>=3.4", "scipy>=1.10" ]
# batman imports distutils, which Python 3.12 removed; setuptools provides it again.
tess = [ "astroquery>=0.4.7", "batman-package>=2.4", "setuptools" ]

[project.urls]
Issues = "https://github.com/Rakiura-Inc/limits-of-habitability/issues"
Source = "https://github.com/Rakiura-Inc/limits-of-habitability"

[dependency-groups]
dev = [
    "nbconvert==7.17.2",
    # Having ruff in the venv helps with IDE's auto lint/format integrations
    "ruff==0.17.3",
    { include-group = "notebooks" },
    { include-group = "pytest" },
]
notebooks = [
    "ipykernel==7.4.0",
    "jupyterlab==4.6.5",
]
pytest = [
    "pytest==9.2.0",
    "pytest-randomly==5.0.0",
    "pytest-xdist==3.8.0",
]

[tool.uv]
# The earliest version that supports the current lock file revision
required-version = ">=0.8.4"
# batman-package 2.5.3 has wheels only up to Python 3.13 and no source to build, so the lock must pick
# a release that installs on every Python this package supports.
required-environments = [ "python_version >= '3.14'" ]

[tool.codespell]
# TOI: TESS Object of Interest, as in TOI-669 b.
ignore-words-list = "toi"
